[project]
name = "convo-portfolio"
version = "0.1.0"
description = "Conversational AI engineering portfolio: 21 projects behind one hub."
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.9,<6",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]
# Training only. Deliberately NOT a runtime dependency: the hub serves cached
# logits, so the Cloud Run image stays small enough for the free tier.
train = [
    "torch>=2.5,<3",
    "transformers>=4.46,<6",
    "datasets>=3.0,<5",
]
# Day 12 only, and build-time only for the same reason: the hub plays a
# committed wav and reads committed timings, so neither onnxruntime nor a
# voice model goes anywhere near the serving image.
voice = [
    "piper-tts>=1.8,<2",
    "soundfile>=0.12,<1",
]
# Day 15 only, build-time only for the same reason again: the hub reads the
# stored query results, so no SQL engine reaches the serving image. The
# BigQuery path needs the Cloud SDK, which is not a Python dependency at all.
analytics = [
    "duckdb>=1.1,<3",
]
# Day 16 needs `google-adk`, and it is deliberately NOT an extra here, because
# declaring it makes the project unresolvable:
#
#     google-adk 2.13  requires  pydantic>=2.12   starlette>=1.3.1,<2
#     gradio   5.x     requires  pydantic<2.12    starlette<1.0
#
# There is no version pair that satisfies both, so `uv sync --extra agents`
# would fail for everyone rather than just for the one day that needs it. Day
# 16 is installed on top of a synced environment instead:
#
#     uv pip install --no-deps google-adk
#     uv pip install --upgrade pydantic   # 2.12, which ADK needs
#
# That leaves an environment neither package's metadata endorses, and day 18
# established why it nonetheless works. Gradio's pydantic cap turns out to be
# conservative: with pydantic 2.12 installed, Gradio still imports and the hub
# still builds, which CI asserts rather than assumes. ADK's starlette floor is
# never reached because day 16 uses its in-process runner and never its
# FastAPI server. And the hub never imports ADK at all — CI blocks that inside
# the built image.
#
# So the conflict is a resolver problem, not a runtime one. This comment
# exists so the next person does not "fix" the missing extra and break
# `uv sync` for everyone.

[project.scripts]
convo-hub = "convo.hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convo"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Gradio layout is nested `with` blocks by design, and so are the span tests.
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Day 9's labels are verbatim quotes from the corpus, matched against it.
# Wrapping them across lines would hide what is actually being matched, and a
# label you cannot read at a glance is a label nobody checks.
"src/convo/projects/day09_retrieval_evals/gold.py" = ["E501"]
# Same reason: the gold quotes are verbatim corpus text and wrapping them
# would stop them matching the source they are quoting.
"src/convo/projects/day11_multiturn_rag/conversations.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
