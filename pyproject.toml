[project]
name = "convo-portfolio"
version = "0.1.0"
description = "Conversational AI engineering portfolio: 21 projects behind one hub."
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.9,<6",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]
# Training only. Deliberately NOT a runtime dependency: the hub serves cached
# logits, so the Cloud Run image stays small enough for the free tier.
train = [
    "torch>=2.5,<3",
    "transformers>=4.46,<6",
    "datasets>=3.0,<5",
]

[project.scripts]
convo-hub = "convo.hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/convo"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Gradio layout is nested `with` blocks by design, and so are the span tests.
ignore = ["SIM117"]

[tool.ruff.lint.per-file-ignores]
# Day 9's labels are verbatim quotes from the corpus, matched against it.
# Wrapping them across lines would hide what is actually being matched, and a
# label you cannot read at a glance is a label nobody checks.
"src/convo/projects/day09_retrieval_evals/gold.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
