name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Its own step, before the suite, so a leaked credential is the first
      # thing that fails rather than one red line among several hundred. The
      # repository is public and a key on the build machine is one paste away
      # from being committed.
      - name: No committed credentials
        run: uv run pytest tests/test_no_secrets.py -q

      - name: Test
        run: uv run pytest -q

      # The conversational eval gate. Separate from the unit tests on purpose:
      # these are end-to-end conversations scored on task, safety and
      # efficiency, judged against a committed baseline. A change that trades
      # safety for task success leaves the overall pass rate flat, so the gate
      # watches each dimension and the diff against the baseline, not one
      # number. Safety's bar is 1.0.
      - name: Conversational evals
        run: uv run python -m convo.projects.day06_eval_harness.gate

      # Day 18's gate, threshold half only. `google-adk` is not *resolvable*
      # alongside gradio — it needs pydantic>=2.12 and gradio caps it below
      # that, so `uv sync` cannot have both — which is why it is absent here.
      # Installed anyway they coexist at runtime, as the `evaluators` job
      # below demonstrates; the earlier wording claimed they could not, and
      # that was wrong. So this checks the stored comparison's thresholds and
      # its agreement baseline and says out loud that it skipped the second
      # evaluator.
      - name: Evaluator comparison, thresholds
        run: uv run python -m convo.projects.day18_eval_gate.gate

      # Day 19's proof, read from its committed artifact. This job has no
      # framework, which is the point: the reachability claim has to be
      # checkable where the bot cannot run, or it is not a gate. The
      # `evaluators` job re-derives it and fails if the artifact has drifted.
      - name: Day 19's committed topology must still hold
        run: |
          uv run python - <<'PY'
          from convo.projects.day19_multi_agent import scope

          graph = scope.committed()
          complaints = scope.audit(graph)
          if complaints:
              raise SystemExit("; ".join(complaints))
          print("reachable from handoff_desk:", sorted(graph.reachable_from(scope.HANDOFF)))
          print("tools reachable from it   :", sorted(graph.tools_reachable_from(scope.HANDOFF)) or "none")
          PY

      # Day 20 is the only week-3 day whose figures cost nothing to re-derive:
      # no model, no key, no quota, and the receiving A2A agent is an ASGI app
      # in the same process. So CI rebuilds the artifact rather than trusting
      # the committed one, and the day's own tests then compare every stored
      # crossing against a fresh measurement. Every other week-3 day can only
      # re-score what a paid run already produced.
      - name: Day 20's A2A crossing, re-derived from scratch
        run: uv run python -m convo.projects.day20_a2a_handoff.build

      # Day 21 audits what the two landing pages publish against the artifacts
      # they describe, and it costs nothing to re-derive: everything it reads
      # is already committed. `--check` rebuilds the payload in memory and
      # fails if the committed artifact disagrees.
      #
      # The front pages do not read that artifact -- they resolve each figure
      # live, which is why they cannot go stale. This step guards the half a
      # resolver cannot: the paragraph beside each number, which does not
      # recompute. A figure that moves fails here, and a person re-reads the
      # sentence next to it.
      - name: Day 21's front page must still match the artifacts
        run: uv run python -m convo.projects.day21_capstone.build --check

      # The deploy workflow generates the site from the artifacts. Building it
      # here too means a broken generator fails on the pull request rather
      # than on the push that was supposed to publish it.
      - name: The site must still build
        run: |
          uv run python -m convo.site.build --out /tmp/site
          test -f /tmp/site/index.html

  # ADK's evaluator, re-scoring day 18's committed trajectories.
  #
  # Its own job because `google-adk` and `gradio` cannot be *resolved*
  # together: ADK needs pydantic>=2.12 and starlette>=1.3.1, gradio 5.x caps
  # pydantic below 2.12. No version pair satisfies both, so declaring an
  # `agents` extra would make `uv sync` fail for everyone rather than for the
  # one day that needs it. Installed with `--no-deps` they coexist fine — the
  # step below proves it — so this job is about the resolver, not the runtime.
  #
  # It calls no model and needs no API key. A trajectory metric needs a
  # recorded trajectory and an expected one, both of which are committed —
  # and if ADK's own evaluator stops producing the scores that were
  # published, that is what this catches. The version is installed outside
  # the lockfile, so pinning it is not enough.
  evaluators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--no-deps` on google-adk is load-bearing and so is the line after
      # it. Letting uv resolve ADK's dependencies normally upgrades starlette
      # past 1.3.1, which gradio imports and this project has not tested; ADK
      # itself runs fine on the older one because day 18 uses its in-process
      # runner, never its FastAPI server. But `--no-deps` also skips the deps
      # the evaluator genuinely needs, and the first attempt at this job died
      # on `No module named google.genai`.
      #
      # So ADK goes in without its pins, and the packages its evaluator path
      # actually imports go in with theirs resolved. None of them pulls
      # starlette. The list was derived by importing the evaluator path and
      # diffing sys.modules against a plain `uv sync --extra dev`, then
      # verified in a throwaway virtualenv built the same way as this job —
      # after two red builds from guessing.
      - name: Install, then add ADK on top
        run: |
          uv sync --extra dev
          uv pip install --no-deps google-adk==2.13.0
          uv pip install google-genai opentelemetry-sdk aiohttp pyarrow protobuf
          uv pip install --upgrade "pydantic>=2.12"

      # This step started life asserting that gradio was not importable here,
      # then that the evaluator path did not import it. Both were wrong, and
      # wrong in the same way: `uv sync` installs this project, gradio is one
      # of its core dependencies, and day 18's package `__init__` imports its
      # Gradio tab — so importing any part of the package imports gradio.
      #
      # Having checked, the interesting fact is the opposite of what I
      # assumed. The two conflict only on *paper*: gradio caps pydantic below
      # 2.12, ADK requires 2.12 or above, so no resolver can satisfy both and
      # `uv sync --extra agents` fails for everyone. Installed anyway, they
      # import together and the gate runs. gradio's cap is conservative.
      #
      # So this asserts the true property — both present, both importable,
      # under the pydantic ADK needs. If that ever stops holding, the
      # separate job is no longer a workaround but a necessity, and the
      # comments above need rewriting rather than quietly rotting.
      - name: ADK and Gradio coexist, despite the declared conflict
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.metadata as md

          import google.adk  # noqa: F401
          import gradio  # noqa: F401

          from convo.projects.day18_eval_gate import adk_eval  # noqa: F401

          print("google-adk", md.version("google-adk"))
          print("gradio    ", md.version("gradio"))
          print("pydantic  ", md.version("pydantic"))
          PY

      - name: ADK must reproduce its committed scores
        run: uv run --no-sync python -m convo.projects.day18_eval_gate.gate --require-adk

      - name: Day 18's own tests, with the framework present
        run: uv run --no-sync pytest tests/test_day18_eval_gate.py -q

      # Day 19's guarantee is a claim about a graph: once the router transfers
      # to the handoff desk, no transfer leads back, so the booking tool is out
      # of scope for the rest of the conversation. That is checkable with no
      # model, no key and no quota, which is the only reason it can be a gate
      # at all — and it runs here rather than in the main job because building
      # the agent tree needs the framework.
      #
      # It also fails if nothing can reach the booking tool, because a
      # guarantee that holds only because the feature is missing is not one.
      - name: Day 19's topology must still make booking unreachable after a handoff
        run: uv run --no-sync python -m convo.projects.day19_multi_agent.build --preflight

      - name: Day 19's own tests, with the framework present
        run: uv run --no-sync pytest tests/test_day19_multi_agent.py -q

  # The container is what Cloud Run actually runs, so build it on every PR.
  # Day 6 extends this job with the eval suite, and day 18 turns the eval
  # pass rate into a deploy gate.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t convo-portfolio:ci .

      - name: Boot it and check it serves
        run: |
          docker run -d --name hub -p 8080:8080 convo-portfolio:ci
          # Gradio's first paint in a cold container took ~20s locally, so the
          # retry window is generous and paced. curl's own retry is used rather
          # than a bare loop, which otherwise burns every attempt in a second.
          if curl -fsS --retry 60 --retry-delay 2 --retry-all-errors \
               --retry-connrefused -o /dev/null http://localhost:8080/; then
            echo "hub answered"
          else
            echo "hub never answered; logs follow" >&2
            docker logs hub >&2
            exit 1
          fi

      # The serving image's size is the one headline figure in this repository
      # that nothing commits, and day 21 would not publish a number it cannot
      # check. So it publishes a ceiling instead, and this is what checks it: a
      # weaker claim that fails loudly beats a precise one that quietly rots.
      - name: The image must stay under the published ceiling
        run: |
          ceiling=$(python3 -c "import json; print(json.load(open('src/convo/projects/day21_capstone/artifacts/capstone.json'))['image_ceiling_mb'])")
          actual=$(docker image inspect convo-portfolio:ci --format '{{.Size}}')
          actual_mb=$((actual / 1000 / 1000))
          echo "image is ${actual_mb} MB; day 21 publishes a ceiling of ${ceiling} MB"
          if [ "$actual_mb" -gt "$ceiling" ]; then
            echo "the image has grown past the figure on the front page" >&2
            exit 1
          fi

      - name: The image must not carry an ML or audio stack
        run: |
          # The whole point of caching artifacts is that the runtime stays small.
          # Day 12 added onnxruntime and piper behind a `voice` extra, day 15
          # added duckdb behind an `analytics` one and day 16 added google-adk
          # behind `agents`; this is what stops a stray dependency quietly
          # promoting any of them to runtime. google.adk is the one most likely
          # to leak, because day 16's tab reads its artifact like every other
          # tab and has no reason to import the framework that produced it.
          for module in torch transformers onnxruntime piper duckdb google.adk; do
            if docker run --rm convo-portfolio:ci python -c "import $module" 2>/dev/null; then
              echo "$module leaked into the runtime image" >&2
              exit 1
            fi
          done
          echo "no ML or audio stack in the image, as intended"
