name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  # The container is what Cloud Run actually runs, so build it on every PR.
  # Day 6 extends this job with the eval suite, and day 18 turns the eval
  # pass rate into a deploy gate.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t convo-portfolio:ci .

      - name: Boot it and check it serves
        run: |
          docker run -d --name hub -p 8080:8080 convo-portfolio:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "hub answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "hub never answered; logs follow" >&2
          docker logs hub >&2
          exit 1
